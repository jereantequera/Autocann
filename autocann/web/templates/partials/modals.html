    <!--
         Modals, and only what a modal is for: a short form, answered and
         dismissed. The grow list and the weekly report used to be here too;
         both are things you browse and come back to, which is a view.
    -->
    <div id="newGrowModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Crear Nuevo Cultivo</div>
            <div class="form-group">
                <label class="form-label" for="newGrowName">Nombre del Cultivo</label>
                <input type="text" id="newGrowName" class="form-control" placeholder="Ej: Cultivo #2 - OG Kush">
            </div>
            <div class="form-group">
                <label class="form-label" for="newGrowStage">Etapa Inicial</label>
                <select id="newGrowStage" class="form-control">
                    <option value="early_veg">Vegetativo Temprano</option>
                    <option value="late_veg">Vegetativo Tardío</option>
                    <option value="flowering">Floración</option>
                    <option value="dry">Secado</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="newGrowNotes">Notas (opcional)</label>
                <textarea id="newGrowNotes" class="form-control" placeholder="Ej: Semillas feminizadas..."></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" data-action="close-modal" data-modal="newGrowModal">Cancelar</button>
                <button class="btn btn-primary" data-action="create-grow">Crear Cultivo</button>
            </div>
        </div>
    </div>

    <!--
         The shell behind confirmDialog() and alertDialog(), which replaced the
         native confirm() and alert(). The markup is here rather than built in
         JavaScript so a dialog looks like every other modal by construction;
         the text and the button labels are written in with textContent,
         because some of it is a server error message.
    -->
    <div id="appDialog" class="modal" role="dialog" aria-modal="true"
         aria-labelledby="dialog-title" aria-describedby="dialog-message"
         aria-hidden="true">
        <div class="modal-content modal-dialog">
            <div class="modal-header" id="dialog-title"></div>
            <div class="dialog-message" id="dialog-message"></div>
            <div class="modal-footer">
                <button class="btn btn-ghost" type="button" id="dialog-cancel">Cancelar</button>
                <button class="btn btn-primary" type="button" id="dialog-confirm">Confirmar</button>
            </div>
        </div>
    </div>

    <!--
         Where "se guardó" goes. Something that worked does not need to be
         acknowledged, and swapping a blocking native alert for a blocking
         custom one would have kept the part that was actually annoying.
    -->
    <div class="toast-tray" id="toast-tray" role="status" aria-live="polite"></div>

    <div id="stageModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Cambiar Etapa</div>
            <div class="form-group">
                <label class="form-label" for="newStage">Nueva Etapa</label>
                <select id="newStage" class="form-control">
                    <option value="early_veg">Vegetativo Temprano</option>
                    <option value="late_veg">Vegetativo Tardío</option>
                    <option value="flowering">Floración</option>
                    <option value="dry">Secado</option>
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" data-action="close-modal" data-modal="stageModal">Cancelar</button>
                <button class="btn btn-primary" data-action="update-stage">Actualizar</button>
            </div>
        </div>
    </div>
