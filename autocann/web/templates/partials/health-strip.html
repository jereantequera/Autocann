        <!-- Estado: three lines that say whether to believe the screen -->
        <!--
             Dos de estas tres no son el estado de un sensor pero se confunden
             con él todo el tiempo: el lazo puede estar en pausa o caído con los
             sensores perfectos, y el histórico puede no estar guardándose con
             todo lo demás andando.

             La tercera es el resumen de las tarjetas de sensores, que se fueron
             a Sistema. Sale del mismo /api/health que las pinta allá, así que
             las dos pantallas no pueden decir cosas distintas — y el renglón es
             un link, porque cuando dice que falta un sensor lo siguiente que se
             quiere es justamente la pantalla que se lo llevó.
        -->
        <div class="health-rows health-strip">
            <div class="health-row" id="health-loop">
                <span class="health-row-name">Lazo de control</span>
                <span class="health-row-state" id="health-loop-state">⏳</span>
                <span class="health-row-detail" id="health-loop-detail"></span>
            </div>
            <div class="health-row" id="health-history">
                <span class="health-row-name">Histórico</span>
                <span class="health-row-state" id="health-history-state">⏳</span>
                <span class="health-row-detail" id="health-history-detail"></span>
            </div>
            <a class="health-row health-row-link" href="#/sistema">
                <span class="health-row-name">Sensores</span>
                <span class="health-row-state" id="health-sensors-state">⏳</span>
                <span class="health-row-detail">Ver detalle en Sistema →</span>
            </a>
        </div>
