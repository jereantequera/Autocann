        <!-- Header -->
        <!--
             Everything that is true of the whole app rather than of one view:
             which grow this is, whether the controller is in charge, and the
             two things anyone does from anywhere - stop the loop, log a
             watering. Both of those used to be buried: the first behind a
             ghost button halfway down the panel, the second at the bottom of a
             tab.

             The grow context used to be a card of its own under the tabs. It
             was never navigation and never a control - it is the sentence the
             rest of the screen is read inside, because every number in the app
             means something different in week two of flowering than in week
             two of veg - and a full-width card was a lot of room for a
             sentence. Up here it sits beside the state of the system, which is
             the other thing that is true everywhere.
        -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">🌿</div>
                <h1>Auto<span>cann</span></h1>
            </div>
{% include "partials/growbar.html" %}

            <div class="header-right">
                <!--
                     A button, not a label. It said "Sistema Activo" and meant
                     it as decoration; the state it reports is also the state
                     you change, so it is the control for it.

                     It is also the only place the pause is announced. There was
                     a full-width banner under this header saying the same three
                     things in longer words, and two elements saying one thing
                     is how you end up reading neither. What the banner had and
                     a chip did not - how long it has been - is in the chip now.
                -->
                <button type="button" class="system-state" id="system-state"
                        data-action="toggle-pause">
                    <span class="status-dot" id="system-state-dot"></span>
                    <span class="system-state-text" id="system-state-text">Sistema activo</span>
                    <span class="system-state-since" id="pause-elapsed"></span>
                    <span class="system-state-action" id="system-state-action">Pausar</span>
                </button>

                <a class="btn btn-primary header-cta" href="#/riego">
                    💧 Agregar riego
                    <span class="header-cta-badge" id="feed-cta-badge" hidden></span>
                </a>

                <div class="last-update" id="last-update">Cargando...</div>
            </div>
        </header>
