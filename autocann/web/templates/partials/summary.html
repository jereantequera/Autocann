        <!-- Period summary: the selected range reduced to numbers -->
        <!--
             The range comes from the one selector in the view header, so this
             block carries no controls of its own.
        -->
        <div class="summary-grid">
            <div class="summary-card">
                <div class="summary-card-header">
                    <div class="summary-card-title">
                        <span class="icon">🌡️</span>
                        Temperatura Interior
                    </div>
                </div>
                <div class="summary-avg" id="summary-temp-avg">--<span class="hero-unit">°C</span></div>
                <div class="summary-minmax">
                    <div class="summary-stat">
                        <span class="summary-stat-label">Mínima</span>
                        <span class="summary-stat-value min" id="summary-temp-min">--°C</span>
                    </div>
                    <div class="summary-stat">
                        <span class="summary-stat-label">Máxima</span>
                        <span class="summary-stat-value max" id="summary-temp-max">--°C</span>
                    </div>
                    <div class="summary-stat">
                        <span class="summary-stat-label">Muestras</span>
                        <span class="summary-stat-value summary-stat-muted" id="summary-samples">--</span>
                    </div>
                </div>
            </div>
            <div class="summary-card">
                <div class="summary-card-header">
                    <div class="summary-card-title">
                        <span class="icon">💧</span>
                        Humedad Interior
                    </div>
                </div>
                <div class="summary-avg" id="summary-humidity-avg">--<span class="hero-unit">%</span></div>
                <div class="summary-minmax">
                    <div class="summary-stat">
                        <span class="summary-stat-label">Mínima</span>
                        <span class="summary-stat-value min" id="summary-humidity-min">--%</span>
                    </div>
                    <div class="summary-stat">
                        <span class="summary-stat-label">Máxima</span>
                        <span class="summary-stat-value max" id="summary-humidity-max">--%</span>
                    </div>
                </div>
            </div>
            <div class="summary-card">
                <div class="summary-card-header">
                    <div class="summary-card-title">
                        <span class="icon">🎯</span>
                        VPD Promedio
                    </div>
                </div>
                <div class="summary-avg" id="summary-vpd-avg">--<span class="hero-unit">kPa</span></div>
                <div class="summary-minmax">
                    <div class="summary-stat">
                        <span class="summary-stat-label">Mínimo</span>
                        <span class="summary-stat-value min" id="summary-vpd-min">-- kPa</span>
                    </div>
                    <div class="summary-stat">
                        <span class="summary-stat-label">Máximo</span>
                        <span class="summary-stat-value max" id="summary-vpd-max">-- kPa</span>
                    </div>
                </div>
            </div>

            <!--
                 The outdoor averages used to sit in the Exterior block next to
                 the live readings, driven by a selector three sections away.
                 They are a summary of the selected period, so they belong with
                 the other summaries.
            -->
            <div class="summary-card summary-card-outside">
                <div class="summary-card-header">
                    <div class="summary-card-title">
                        <span class="icon">🌤️</span>
                        Exterior
                    </div>
                </div>
                <div class="summary-minmax">
                    <div class="summary-stat">
                        <span class="summary-stat-label">Temp. Prom.</span>
                        <span class="summary-stat-value outside" id="summary-outside-temp">--°C</span>
                    </div>
                    <div class="summary-stat">
                        <span class="summary-stat-label">Hum. Prom.</span>
                        <span class="summary-stat-value outside" id="summary-outside-humidity">--%</span>
                    </div>
                </div>
            </div>

            <!-- VPD Score Card -->
            <div class="vpd-score-card">
                <div class="vpd-score-header">
                    <div class="vpd-score-title">
                        <span>🏆</span>
                        VPD Score (7 días)
                    </div>
                    <span class="vpd-score-range" id="vpd-score-range">--</span>
                </div>
                <div class="vpd-score-value" id="vpd-score-value">--%</div>
                <div class="vpd-score-label" id="vpd-score-label">% del tiempo en rango óptimo</div>
                <div class="vpd-score-bar" id="vpd-score-bar">
                    <!-- Daily bars will be inserted here -->
                </div>
                <div class="vpd-score-days-labels" id="vpd-score-days-labels">
                    <!-- Day labels will be inserted here -->
                </div>
            </div>
        </div>
