# Broker de DESARROLLO. Se corre desde la raíz del repo:
#
#   mosquitto -c deploy/mosquitto/mosquitto.conf
#
# Para producción el plan es EMQX: Mosquitto no puede atar el client id al
# certificado, así que un equipo con un certificado válido podría conectarse con
# el client id de otro y desconectarlo (no publicar en su nombre: eso lo impide
# la ACL). Ver docs/platform.md.

per_listener_settings false
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type subscribe

# Sólo mTLS. No hay listener en texto plano.
listener 8883
cafile deploy/pki/out/ca-chain.pem
certfile deploy/pki/out/broker/broker.pem
keyfile deploy/pki/out/broker/broker.key
tls_version tlsv1.3
require_certificate true
# El CN del certificado pasa a ser el usuario, y la ACL decide con él.
use_identity_as_username true
allow_anonymous false

acl_file deploy/mosquitto/acl.conf
