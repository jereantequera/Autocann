# Lo que no está permitido acá, está prohibido.

# Equipos: cada uno publica y escucha SÓLO bajo su propio id (%u es el CN de su
# certificado). Esta regla es la que hace confiable el device_id del tópico.
pattern write v1/devices/%u/telemetry
pattern write v1/devices/%u/state
pattern read v1/devices/%u/commands

# Servicios. La suscripción del ingestor es común, no $share: ver
# crates/ingest/src/main.rs.
#
# El ':' del CN hace que ningún equipo pueda llamarse así.
user svc:ingest
topic read v1/devices/+/telemetry
