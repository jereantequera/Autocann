[project]
name = "autocann"
version = "0.1.0"
description = "Cannabis cultivation automation system with VPD control"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0.0",
    "pytz>=2024.1",
    "redis>=5.0.0",
]

[project.optional-dependencies]
# Raspberry Pi specific dependencies (only install on Raspberry Pi)
rpi = [
    "adafruit-circuitpython-dht>=4.0.0",
    "adafruit-blinka>=8.0.0",
    "gpiozero>=2.0.0",
    "RPi.GPIO>=0.7.1",
]
dev = [
    "ruff>=0.1.0",
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The control logic is pure, so the suite stays fast enough to run on every edit.
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear: likely bugs, including the mutable-default and
            # loop-variable traps this codebase had
]
ignore = [
    "E501",  # long lines are handled by the formatter, not the linter
]

