        <!-- Estadísticas: the history, and the one selector that drives it -->
        <!--
             The range selector used to exist twice — once over the summary
             cards, once over the charts — with JavaScript keeping the two in
             sync. They were two halves of the same thing separated by three
             unrelated sections. Now there is one selector and it sits above
             everything it changes.
        -->
        <section class="view view-stats" data-view="stats" aria-label="Estadísticas">
            <div class="stats-toolbar">
                <!-- The heading names the period on screen, so the period is never a guess. -->
                <h1 class="stats-title" id="summary-period-label">Últimas 24 horas</h1>
                <!--
                     Qué cultivo, antes de qué rango de tiempo: una ventana de
                     30 o 90 días cruzaba el final de un cultivo con el arranque
                     del siguiente y los dibujaba como una sola curva. El valor
                     por defecto es el cultivo activo, que es de lo que habla
                     todo el resto del tablero; "todos" sigue estando, pero hay
                     que pedirlo.
                -->
                <div class="ac-field stats-cultivo">
                    <label class="ac-field__label" for="grow-filter">Cultivo</label>
                    <select class="ac-field__input" id="grow-filter">
                        <option value="">Cultivo activo</option>
                    </select>
                </div>
                <div class="time-selector" id="time-selector">
                    <div class="ac-segmented" role="group" aria-label="Período">
                    <button type="button" class="ac-segmented__item time-btn" data-hours="1" data-interval="raw" aria-pressed="false">1 h</button>
                    <button type="button" class="ac-segmented__item time-btn" data-hours="2" data-interval="raw" aria-pressed="false">2 h</button>
                    <button type="button" class="ac-segmented__item time-btn" data-hours="4" data-interval="raw" aria-pressed="false">4 h</button>
                    <button type="button" class="ac-segmented__item time-btn" data-hours="8" data-interval="raw" aria-pressed="false">8 h</button>
                    <button type="button" class="ac-segmented__item time-btn" data-hours="12" data-interval="raw" aria-pressed="false">12 h</button>
                    <button type="button" class="ac-segmented__item time-btn active" data-period="1" data-interval="hourly" aria-pressed="true">24 h</button>
                    <button type="button" class="ac-segmented__item time-btn" data-period="3" data-interval="hourly" aria-pressed="false">3 d</button>
                    <button type="button" class="ac-segmented__item time-btn" data-period="7" data-interval="hourly" aria-pressed="false">7 d</button>
                    <button type="button" class="ac-segmented__item time-btn" data-period="30" data-interval="6hourly" aria-pressed="false">30 d</button>
                    </div>
                </div>
            </div>

            <!--
                 Qué cultivo está mirando, cuando no es el obvio. El alcance se
                 resuelve en el servidor, así que un gráfico que no pregunta no
                 tiene con qué etiquetarse.
            -->
            <p class="stats-note" id="grow-scope-note" hidden></p>

{% include "partials/summary.html" %}
{% include "partials/charts.html" %}
        </section>
