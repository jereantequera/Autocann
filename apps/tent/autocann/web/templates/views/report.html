        <!-- Reportes: the weekly report, read rather than glanced at -->
        <!--
             This was a modal behind a ghost button in the grow bar: the densest
             thing the app produces, opened the way a confirmation dialog is.
             A report is read, scrolled and compared, which is a view's job, and
             a modal cannot be linked to or left open on a second screen.
        -->
        <section class="view view-report" data-view="reportes" aria-label="Reportes">
            <header class="rpt-head">
                <div class="rpt-head__text">
                    <h1 class="rpt-title" id="report-title">Reporte semanal</h1>
                    <p class="rpt-sub">Basado en <span id="report-samples">--</span> muestras</p>
                </div>
                <button type="button" class="ac-btn ac-btn--secondary" data-action="weekly-report">Recalcular</button>
            </header>

            <!-- Shown until the first answer; the words stay for a screen reader. -->
            <div id="report-loading" class="rpt-skeleton">
                <span class="ac-skeleton rpt-skeleton__row" aria-hidden="true"></span>
                <span class="ac-skeleton rpt-skeleton__chart" aria-hidden="true"></span>
                <span class="rpt-skeleton__label">Generando reporte</span>
            </div>

            <p id="report-error" class="ac-empty" hidden></p>

            <div id="report-content" class="rpt-body" hidden>
                <div class="ac-readout-row rpt-readouts">
                    <div class="ac-readout ac-readout--lg rpt-readouts__main">
                        <span class="ac-readout__label">Tiempo con el VPD en rango</span>
                        <span class="ac-readout__value" id="report-vpd-score">--<span class="ac-readout__unit"> %</span></span>
                        <span class="ac-readout__sub"><span class="rpt-trend" id="report-vpd-trend">--</span></span>
                    </div>
                    <div class="ac-readout ac-readout--md">
                        <span class="ac-readout__label">Temperatura prom.</span>
                        <span class="ac-readout__value" id="report-temp-avg">--<span class="ac-readout__unit"> °C</span></span>
                        <span class="ac-readout__sub"><span class="rpt-trend" id="report-temp-trend">--</span></span>
                    </div>
                    <div class="ac-readout ac-readout--md">
                        <span class="ac-readout__label">Humedad prom.</span>
                        <span class="ac-readout__value" id="report-humidity-avg">--<span class="ac-readout__unit"> %</span></span>
                        <span class="ac-readout__sub"><span class="rpt-trend" id="report-humidity-trend">--</span></span>
                    </div>
                </div>

                <div class="rpt-columns">
                    <section class="rpt-block">
                        <h2 class="rpt-block__title">En rango, por hora del día</h2>
                        <p class="rpt-block__sub">Promedio del período. Lo bajo al mediodía suele ser de las luces a pleno.</p>
                        <div class="rpt-hours" id="report-hourly-chart" role="img" aria-label="Porcentaje de tiempo en rango para cada hora del día"></div>
                        <div class="rpt-hours-labels" aria-hidden="true">
                            <span>00</span><span>06</span><span>12</span><span>18</span><span>23</span>
                        </div>
                        <div class="rpt-extremes">
                            <div><span class="rpt-extremes__key">Mejor hora</span> <span class="rpt-extremes__val" id="report-best">--</span></div>
                            <div><span class="rpt-extremes__key">Peor hora</span> <span class="rpt-extremes__val is-low" id="report-worst">--</span></div>
                        </div>
                    </section>

                    <section class="rpt-block">
                        <h2 class="rpt-block__title">Por día</h2>
                        <div class="rpt-daily" id="report-daily-scores"></div>
                    </section>
                </div>
            </div>
        </section>
