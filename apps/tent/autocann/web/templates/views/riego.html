        <!-- Riego: the calendar, today's doses, and the log -->
        <!--
             The log alone answers "when did I last water" and nothing else. A
             month on a grid answers the question actually worth asking — am I
             watering on a rhythm, and where are the gaps — which a reverse
             chronological list hides by construction.
        -->
        <section class="view view-riego" data-view="riego" aria-label="Riego">
            <div class="riego-grid">
                <div class="riego-main">
                    {% include "partials/feeding.html" %}
                </div>

                <aside class="riego-side">
                    {% include "partials/irrigation-next.html" %}

                    <div class="cal-panel" id="cal-panel">
                        <div class="cal-head">
                            <h2 class="cal-month" id="cal-month">--</h2>
                            <div class="cal-nav">
                                <button class="ac-btn ac-btn--secondary ac-btn--icon" data-cal="prev"
                                        aria-label="Mes anterior">
                                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2"
                                         stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
                                </button>
                                <button class="ac-btn ac-btn--secondary ac-btn--icon" data-cal="next"
                                        aria-label="Mes siguiente">
                                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-width="2"
                                         stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
                                </button>
                                <button class="ac-btn ac-btn--ghost" data-cal="today">Hoy</button>
                            </div>
                        </div>

                        <div class="calendar">
                            <div class="cal-weekdays" aria-hidden="true">
                                <span>L</span><span>M</span><span>M</span><span>J</span>
                                <span>V</span><span>S</span><span>D</span>
                            </div>
                            <div class="cal-grid" id="cal-grid"></div>
                        </div>

                        <div class="cal-footer">
                            <div class="ac-legend">
                                <span class="ac-legend__item"><span class="ac-dot ac-dot--info"></span>Regado</span>
                                <span class="ac-legend__item"><span class="ac-dot ac-dot--warn"></span>Fuera del plan</span>
                                <span class="ac-legend__item"><span class="ac-dot ac-dot--idle"></span>Sólo agua</span>
                            </div>
                            <p class="ac-field__hint cal-streak" id="cal-streak"></p>
                        </div>

                        <!-- A day only opens when it has something to show, so the
                             panel is absent rather than empty the rest of the time. -->
                        <div class="cal-detail" id="cal-detail" hidden></div>
                    </div>

                    <div class="riego-log">
                        <div class="riego-log-head">
                            <h2 class="riego-log-title">Últimos riegos</h2>
                            <span class="ac-field__hint" id="feed-last-badge">--</span>
                        </div>
                        <div class="ac-log" id="feed-history"></div>
                    </div>
                </aside>
            </div>
        </section>
