        <!--
             Una sola ranura de alertas, arriba del contenido. Los tres carteles
             son `.ac-alert` y ninguno se ve sin su clase `show`: el de conexión
             lo prende api.js, los otros dos health.js (que decide cuál).

             Por qué uno solo: un cartel rojo de sensores y otro de anomalías
             pegados decían lo mismo dos veces. Cuando algo está roto, las
             anomalías se cuentan como una línea dentro del cartel roto.
        -->
        <div id="connection-alert" class="ac-alert alert-box alert-box--conn" role="status" aria-live="polite">
            <span class="alert-icon" aria-hidden="true">{{ icon("wifi-off") }}</span>
            <div class="ac-alert__body">
                <div class="ac-alert__title">Sin conexión al backend</div>
                <div class="ac-alert__text">
                    Los valores en pantalla son los últimos recibidos y pueden estar viejos.
                    Revisá que el servicio esté corriendo: <code>make status</code>
                </div>
            </div>
        </div>

        <div id="sensor-alert" class="ac-alert alert-box" role="status" aria-live="polite">
            <span class="alert-icon" aria-hidden="true">{{ icon("triangle-alert") }}</span>
            <div class="ac-alert__body">
                <div class="ac-alert__title" id="sensor-alert-title">Problema con sensores</div>
                <div class="ac-alert__text" id="sensor-alert-message">--</div>
                <div class="alert-more" id="sensor-alert-more" hidden></div>
            </div>
            <a class="ac-btn ac-btn--secondary" href="#/sistema">Ver sistema</a>
        </div>

        <div id="anomalies-alert" class="ac-alert alert-box alert-box--warn" role="status" aria-live="polite">
            <span class="alert-icon" id="anomalies-icon" aria-hidden="true">{{ icon("triangle-alert") }}</span>
            <div class="ac-alert__body">
                <!-- The button lives in the title row, not beside the body: there it
                     floated between the title and the list, and the list stopped
                     short of it, leaving the card with two right edges. -->
                <div class="ac-alert__head">
                    <div class="ac-alert__title" id="anomalies-title-text">Advertencias detectadas</div>
                    <button type="button" class="ac-btn ac-btn--ghost" data-action="dismiss-anomalies">Descartar</button>
                </div>
                <div class="anomalies-list" id="anomalies-list">
                    <!-- Anomalies will be inserted here -->
                </div>
            </div>
        </div>
