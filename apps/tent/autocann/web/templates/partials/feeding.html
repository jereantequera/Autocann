        <!-- Riego - the watering form for today, and the weekly plan it can switch to -->
        <!--
             The stage and the day inside it come from the active grow, so this
             never asks for dates the backend already knows. The chart itself
             lives in the database: the grid below is an editor for it, not a
             copy of a printed table. The two modes share one column because
             they answer one question each: what goes in the jug now, and what
             the chart says for the whole cycle.
        -->
        <div class="riego-head">
            <h1 class="riego-title">Registrar riego</h1>
            <div class="ac-segmented" role="tablist" aria-label="Riego">
                <button type="button" class="ac-segmented__item" role="tab" aria-selected="true"
                        id="feed-mode-today" data-action="toggle-feed-plan" data-mode="today">Hoy</button>
                <button type="button" class="ac-segmented__item" role="tab" aria-selected="false"
                        id="feed-mode-plan" data-action="toggle-feed-plan" data-mode="plan">Plan por semana</button>
            </div>
        </div>
        <p class="ac-status__text riego-sub" id="feed-week">--</p>

        <div class="feed-form" id="feed-form">
            <div class="riego-litres">
                <div class="ac-field">
                    <label class="ac-field__label" for="feed-litres">Litros de solución</label>
                    <input type="number" id="feed-litres" class="ac-field__input ac-field__input--xl ac-field__input--num"
                           min="0.1" step="0.5" inputmode="decimal" value="10">
                </div>
                <p class="ac-field__hint">Las cantidades se recalculan<br>con los litros.</p>
            </div>

            <!-- Only filled when there is no nutrient to pour this week; the product rows say the rest. -->
            <div class="ac-empty feed-notice" id="feed-doses" hidden></div>

            <div class="feed-products-head" aria-hidden="true">
                <span></span><span>Producto</span><span class="feed-right">Dosis</span><span class="feed-right">Total</span>
            </div>
            <div class="feed-products" id="feed-products">
                <div class="loading">Cargando productos</div>
            </div>

            <div class="riego-measures">
                <div class="ac-field">
                    <label class="ac-field__label" for="feed-ph">pH</label>
                    <input type="number" id="feed-ph" class="ac-field__input ac-field__input--num"
                           step="0.1" min="3" max="9" inputmode="decimal" placeholder="6,0">
                </div>
                <div class="ac-field">
                    <label class="ac-field__label" for="feed-ec">EC</label>
                    <input type="number" id="feed-ec" class="ac-field__input ac-field__input--num"
                           step="0.1" min="0" max="5" inputmode="decimal" placeholder="1,8">
                </div>
                <div class="ac-field riego-note">
                    <label class="ac-field__label" for="feed-notes">Nota</label>
                    <input type="text" id="feed-notes" class="ac-field__input"
                           placeholder="Puntas quemadas en la de la izquierda…">
                </div>
            </div>

            <div class="riego-actions">
                <button class="ac-btn ac-btn--primary" data-action="feed-save">Guardar riego</button>
                <button class="ac-btn ac-btn--secondary" data-action="feed-reset"
                        title="Volver a lo que dice el plan">Volver al plan</button>
            </div>
        </div>

        <!-- Plan semanal, oculto hasta que se pide -->
        <div class="feed-plan-editor" id="feed-plan-editor" hidden>
            <p class="feed-plan-intro">
                Cada celda es la dosis de ese producto en esa semana de la etapa.
                Vacío significa que no se aplica. Las columnas salen de la duración
                típica de cada etapa.
            </p>
            <p class="feed-plan-current" id="feed-plan-current" hidden></p>
            <div class="feed-plan-scroll">
                <table class="feed-plan-table" id="feed-plan-table"></table>
            </div>
            <div class="feed-plan-actions">
                <button class="ac-btn ac-btn--primary" data-action="feed-plan-save">Guardar plan</button>
                <button class="ac-btn ac-btn--secondary" data-action="feed-plan-add"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Agregar producto</button>
                <span class="ac-field__hint feed-plan-state" id="feed-plan-state"></span>
            </div>
        </div>
