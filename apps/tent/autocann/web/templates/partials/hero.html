        <!-- Ambiente: how the tent is, right now -->
        <!--
             Four cards, and the fourth is the outside air - it used to be a
             section of its own down the right-hand column, which made reading
             "how is the tent" a two-stop job. Inside and outside belong in the
             same glance: the second is the reason the first is drifting.

             The target humidity used to be a fourth big number of its own,
             usually "--", next to the humidity it is the target *for*. It is a
             line inside the humidity card now, where the comparison is the
             point.
        -->
        <div class="section-header section-header-row">
            <h2 class="section-title">
                <span class="section-title-icon">{{ icon("thermometer") }}</span>
                Ambiente
            </h2>
            <span class="sensor-badge" id="sensor-status-indoor">{{ icon("hourglass") }}</span>
        </div>

        <div class="hero-grid">
            <!-- VPD Card -->
            <div class="hero-card hero-vpd" id="vpd-card">
                <div class="hero-header">
                    <div class="hero-label" title="VPD de hoja (leaf VPD): valor relevante para las plantas">{{ icon("gauge") }} VPD Hoja</div>
                </div>
                <div class="hero-value" id="current-vpd">--<span class="hero-unit">kPa</span></div>
                <div class="hero-subtitle">
                    <span class="vpd-badge" id="vpd-status"></span>
                    <span id="vpd-target-hint"></span>
                </div>
                <div class="vpd-gauge">
                    <div class="vpd-gauge-bar">
                        <div class="vpd-gauge-zones">
                            <div class="vpd-zone low"></div>
                            <div class="vpd-zone optimal"></div>
                            <div class="vpd-zone high"></div>
                        </div>
                        <div class="vpd-gauge-marker" id="vpd-marker" style="left: 50%"></div>
                    </div>
                    <div class="vpd-gauge-labels">
                        <span>0.0</span>
                        <span>0.6</span>
                        <span>1.5</span>
                        <span>2.0</span>
                    </div>
                </div>
            </div>

            <!-- Temperature Card -->
            <div class="hero-card hero-temp">
                <div class="hero-header">
                    <div class="hero-label">{{ icon("thermometer") }} Temperatura</div>
                </div>
                <div class="hero-value temp-value" id="current-temp">--<span class="hero-unit">°C</span></div>
                <div class="hero-subtitle">
                    <span style="color: var(--text-muted);">Hoja</span>
                    <strong id="current-leaf-temp">--</strong>°C
                </div>
            </div>

            <!-- Humidity Card: what it is, and what it is being driven to -->
            <div class="hero-card hero-humidity">
                <div class="hero-header">
                    <div class="hero-label">{{ icon("droplet") }} Humedad</div>
                </div>
                <div class="hero-value humidity-value" id="current-humidity">--<span class="hero-unit">%</span></div>
                <div class="hero-subtitle">
                    <span style="color: var(--text-muted);">Objetivo</span>
                    <strong id="current-target-humidity">--</strong>%
                    <span class="humidity-diff" id="humidity-diff"></span>
                </div>
                <div class="humidity-bar-container">
                    <div class="humidity-bar">
                        <div class="humidity-bar-fill" id="humidity-bar-fill" style="width: 0%"></div>
                        <div class="humidity-bar-target" id="humidity-bar-target" style="left: 50%"></div>
                    </div>
                    <div class="humidity-bar-labels">
                        <span>0%</span>
                        <span>50%</span>
                        <span>100%</span>
                    </div>
                </div>
            </div>

{% include "partials/outdoor.html" %}
        </div>
