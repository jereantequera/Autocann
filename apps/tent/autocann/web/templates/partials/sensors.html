        <!-- Indoor Sensors - one card per physical sensor -->
        <!--
             La pregunta que contesta esta sección no es "cuánto mide cada
             sensor" sino "¿anda?". Antes había que deducirlo: el badge de
             arriba venía del lazo de control, cada tarjeta de la antigüedad de
             su propia lectura, y el cartel rojo de anomalías de la base de
             datos — y los tres podían decir cosas distintas al mismo tiempo.
             Ahora todo esto sale de /api/health, que es un solo veredicto, y
             cada tarjeta dice en castellano qué le pasa y qué mirar.

             Vive en Sistema, no en el Panel. Son seis tarjetas de diagnóstico —
             lectura cruda, rol, antigüedad, deriva — y estaban ocupando la
             mitad de la pantalla que se mira de lejos para saber cómo está la
             carpa, repitiendo en chico los números que el Ambiente muestra en
             grande. Lo que el Panel necesita de todo esto es una línea: si los
             sensores están posteando o no. Eso quedó allá; esto es la pantalla
             a la que se viene cuando esa línea dice que algo anda mal, al lado
             de la calibración, la conectividad y el log del nodo.

             El Ambiente muestra el primario después del filtro de mediana y de
             la calibración, que es el número sobre el que se controla. Acá se
             ve lo que cada sensor posteó de verdad, que es la única forma de
             ver al testigo — y de notar que los dos se están contradiciendo
             antes de que el detector de deriva junte muestras suficientes para
             decirlo.
        -->
        <div class="section-header section-header-row">
            <h2 class="section-title">
                <span class="section-title-icon">📍</span>
                Sensores
            </h2>
            <span class="sensor-badge" id="sensors-badge">⏳</span>
        </div>

        <div class="sensors-grid" id="indoor-sensors-grid">
            <div class="sensor-card">
                <div class="sensor-card-header">
                    <div class="sensor-card-name">Cargando...</div>
                </div>
            </div>
        </div>

        <div class="sensors-note">
            Lecturas crudas, tal como las posteó el nodo: sin filtro de mediana
            ni calibración. Pueden diferir unas décimas de las tarjetas del Panel.
        </div>
