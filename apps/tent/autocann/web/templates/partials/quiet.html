                    <!-- Quiet hours -->
                    <!--
                         The window constrains the controller's *decision*, not the relay —
                         so this screen never talks about forcing a contact. It asks which
                         output may not be started, between when and when, and at what
                         humidity the whole thing is called off.

                         The escape hatch is a field and not a checkbox because the number
                         is the decision: a night at 85 % is mould, and leaving it empty is
                         choosing quiet over the plants. That is a real choice, but it has
                         to be made on purpose.
                    -->
                    <section id="sys-silencio" class="sys-section" aria-labelledby="sys-silencio-title">
                        <div class="sys-section-head">
                            <h2 class="sys-h2" id="sys-silencio-title">Horarios de silencio</h2>
                            <span class="sensor-badge" id="quiet-badge">{{ icon("hourglass") }}</span>
                        </div>
                        <p class="sys-lede">
                            Dentro de la franja el lazo <strong>no elige</strong> encender esa salida.
                            Nunca apaga algo que ya está andando ni corta un mínimo de encendido, y
                            una orden a mano pasa igual. El lazo toma el cambio en menos de 30 s.
                        </p>
                        <div class="quiet-grid" id="quiet-grid">
                            <div class="loading">Cargando franjas</div>
                        </div>
                        <div class="quiet-actions">
                            <button type="button" class="ac-btn ac-btn--primary" data-quiet="save">Guardar franjas</button>
                            <span class="quiet-state" id="quiet-state" aria-live="polite"></span>
                        </div>
                    </section>
